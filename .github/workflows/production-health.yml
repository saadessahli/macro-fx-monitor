name: Production data health

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check public source health
        run: |
          response="$(curl --fail-with-body --retry 3 "$SITE_URL/api/data-status")"
          echo "$response"
          echo "$response" | grep -q '"healthy":true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
