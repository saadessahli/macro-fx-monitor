name: Publish weekly macro snapshot

on:
  schedule:
    - cron: "0 13 * * 6"
  workflow_dispatch:

jobs:
  publish:
    if: vars.SNAPSHOT_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish weekly snapshot
        run: |
          curl --fail-with-body --retry 3 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{"frequency":"weekly"}' \
            "$SITE_URL/api/cron/publish-snapshot"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
